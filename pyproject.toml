[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tic4206066-exoplanet-verification"
version = "1.0.0"
description = "Socratic Elenchus Falsification, Lean 4 Formal Verification, and Cloud Run Discovery Portal for Exoplanet Candidate TIC 4206066 b"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Pavel Rabtsevich", email = "pavel@example.com" },
    { name = "SocrateAI Research Lab", email = "research@socrateai.com" }
]
keywords = [
    "astrophysics",
    "exoplanet",
    "tess",
    "tic4206066",
    "socratic-elenchus",
    "lean4",
    "formal-verification",
    "transit-photometry"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "astropy>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anse*", "subprojects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

name: CI Verification Battery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (Astrophysics Falsification & Backend API)
        run: |
          PYTHONPATH=. pytest -v

      - name: Run End-to-End Workflow Verification
        run: |
          PYTHONPATH=. python scripts/run_tic4206066_workflow.py

      - name: Test Sector 110 Scheduler
        run: |
          PYTHONPATH=. python scripts/tic4206066_scheduler.py --status
          PYTHONPATH=. python scripts/tic4206066_scheduler.py --dry-run
